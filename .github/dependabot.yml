version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "release:patch"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/zed-rovo"
    schedule:
      interval: weekly
    labels:
      - "release:patch"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/examples/hello_world"
    schedule:
      interval: weekly
    labels:
      - "release:patch"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/vscode-rovo"
    schedule:
      interval: weekly
    labels:
      - "release:patch"
    ignore:
      # Must stay in step with engines.vscode, otherwise vsce package fails
      - dependency-name: "@types/vscode"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gradle
    directory: "/jetbrains-plugin"
    schedule:
      interval: weekly
    labels:
      - "release:patch"
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "release:patch"
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
