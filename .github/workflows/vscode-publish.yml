name: Publish VSCode Extension

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (tag or branch)"
        type: string
        required: false
        default: ""
    secrets:
      VSCE_PAT:
        description: "VS Code Marketplace Personal Access Token"
        required: true
      OVSX_PAT:
        description: "Open VSX Registry Personal Access Token"
        required: true
  workflow_dispatch:

permissions: {}

jobs:
  # Runs repository-controlled code (npm install scripts, esbuild) so it gets
  # no secrets and a read-only token
  build:
    name: Build VS Code Extension
    # Only code from the protected default branch (or a release tag built from
    # it by the caller) is built. Manual dispatch against any other branch is
    # refused before checkout.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-rovo/package-lock.json

      - name: Install dependencies
        working-directory: vscode-rovo
        run: npm ci

      - name: Package extension
        working-directory: vscode-rovo
        run: npm run package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-extension
          path: vscode-rovo/*.vsix
          if-no-files-found: error
          retention-days: 1

  # Holds the marketplace tokens but never checks out or executes repository
  # code: it only publishes the prebuilt .vsix with version-pinned CLIs
  publish:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vscode-extension

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.7.1 publish --packagePath ./*.vsix

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@0.10.9 publish ./*.vsix -p "$OVSX_PAT"
