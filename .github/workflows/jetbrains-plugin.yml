name: JetBrains Plugin CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'jetbrains-plugin/**'
      - 'rovo-lsp/**'
      - '.github/workflows/jetbrains-plugin.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'jetbrains-plugin/**'
      - 'rovo-lsp/**'
      - '.github/workflows/jetbrains-plugin.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Plugin
        working-directory: jetbrains-plugin
        run: ./gradlew buildPlugin

      - name: Verify Plugin
        working-directory: jetbrains-plugin
        run: ./gradlew verifyPlugin

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rovo-jetbrains-plugin
          path: jetbrains-plugin/build/distributions/*.zip
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run Tests
        working-directory: jetbrains-plugin
        run: ./gradlew test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-report
          path: jetbrains-plugin/build/reports/tests/
          retention-days: 7

  lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check code style
        working-directory: jetbrains-plugin
        run: ./gradlew check

  compatibility:
    name: Plugin Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ide-version: ['2023.2', '2023.3', '2024.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test with IDE ${{ matrix.ide-version }}
        working-directory: jetbrains-plugin
        run: ./gradlew verifyPlugin -PplatformVersion=${{ matrix.ide-version }}
        continue-on-error: true

  build-lsp:
    name: Build LSP Server
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rovo-lsp

      - name: Build rovo-lsp
        working-directory: rovo-lsp
        run: cargo build --release

      - name: Test rovo-lsp
        working-directory: rovo-lsp
        run: cargo test --release

      - name: Upload LSP Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rovo-lsp-${{ matrix.os }}
          path: |
            rovo-lsp/target/release/rovo-lsp
            rovo-lsp/target/release/rovo-lsp.exe
          retention-days: 30
          if-no-files-found: ignore
