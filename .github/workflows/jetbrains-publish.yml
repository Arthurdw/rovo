name: Publish JetBrains Plugin

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (tag or branch)"
        type: string
        required: false
        default: ""
    secrets:
      JETBRAINS_CERTIFICATE_CHAIN:
        description: "JetBrains plugin signing certificate chain"
        required: true
      JETBRAINS_PRIVATE_KEY:
        description: "JetBrains plugin signing private key"
        required: true
      JETBRAINS_PRIVATE_KEY_PASSWORD:
        description: "JetBrains plugin signing private key password"
        required: true
      JETBRAINS_PUBLISH_TOKEN:
        description: "JetBrains Marketplace publish token"
        required: true
  workflow_dispatch:

concurrency:
  group: jetbrains-publish
  cancel-in-progress: false

permissions: {}

jobs:
  # This job executes repository-controlled Gradle code and therefore must
  # never receive any secret.
  build:
    name: Build and verify JetBrains plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Build Plugin
        working-directory: jetbrains-plugin
        run: ./gradlew buildPlugin

      - name: Verify Plugin
        working-directory: jetbrains-plugin
        run: ./gradlew verifyPlugin

      - name: Collect unsigned plugin archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(jetbrains-plugin/build/distributions/*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one plugin archive, found ${#archives[@]}" >&2
            exit 1
          fi
          mkdir -p unsigned
          cp "${archives[0]}" unsigned/plugin.zip

      - name: Upload unsigned plugin archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jetbrains-plugin-unsigned
          path: unsigned/plugin.zip
          if-no-files-found: error
          retention-days: 1

  # This job holds the signing and publishing secrets. It deliberately does not
  # check out the repository or run Gradle, so no repository-controlled code can
  # read the credentials. It only handles the built archive as opaque data.
  sign-and-publish:
    name: Sign and publish to JetBrains Marketplace
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PLUGIN_XML_ID: com.rovo.lsp
      ZIP_SIGNER_VERSION: "0.1.24"
    steps:
      - name: Download unsigned plugin archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jetbrains-plugin-unsigned
          path: unsigned

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Marketplace ZIP Signer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output zip-signer.jar \
            "https://github.com/JetBrains/marketplace-zip-signer/releases/download/${ZIP_SIGNER_VERSION}/marketplace-zip-signer-cli.jar"

      - name: Sign Plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$CERTIFICATE_CHAIN" > "$keydir/chain.crt"
          printf '%s' "$PRIVATE_KEY" > "$keydir/private.pem"
          mkdir -p signed
          java -jar zip-signer.jar sign \
            -in unsigned/plugin.zip \
            -out signed/plugin-signed.zip \
            -cert-file "$keydir/chain.crt" \
            -key-file "$keydir/private.pem" \
            -key-pass "$PRIVATE_KEY_PASSWORD"

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${PUBLISH_TOKEN}" \
            --form "xmlId=${PLUGIN_XML_ID}" \
            --form "file=@signed/plugin-signed.zip" \
            "https://plugins.jetbrains.com/plugin/uploadPlugin"
