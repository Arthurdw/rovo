---
name: Weekly Release
run-name: weekly-release

on:
  schedule:
    # Every Wednesday at 9:00 AM UTC
    - cron: "0 9 * * 3"
  workflow_dispatch:
    inputs:
      force:
        description: "Force release even without code changes"
        type: boolean
        default: false
      include_ci_changes:
        description: "Include .github/ changes in release check"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-changes:
    name: Check for Changes
    # The release jobs hold the release app and registry tokens, so a manual
    # dispatch against any non-default branch must not run them
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes since last release
        id: check
        env:
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_INCLUDE_CI_CHANGES: ${{ inputs.include_ci_changes }}
        run: |
          # Force release if requested
          if [ "$INPUT_FORCE" == "true" ]; then
            echo "Force release requested"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get last release tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found, proceeding with release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Last release tag: $LAST_TAG"

          # Get files changed since last release (excluding version bump commits)
          CHANGED_FILES=$(git log ${LAST_TAG}..HEAD --grep="chore(release):" --invert-grep --name-only --pretty=format: | sort -u | grep -v '^$' || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed since last release"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Files changed since $LAST_TAG:"
          echo "$CHANGED_FILES"

          # Filter out .github/ changes unless override is set
          if [ "$INPUT_INCLUDE_CI_CHANGES" != "true" ]; then
            RELEASE_FILES=$(echo "$CHANGED_FILES" | grep -v '^\.github/' || echo "")
          else
            RELEASE_FILES="$CHANGED_FILES"
            echo "(including .github/ changes due to manual override)"
          fi

          if [ -n "$RELEASE_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Release needed - found changes outside .github/"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No release needed - only .github/ changes detected"
          fi

  release:
    name: Release
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      skipped: ${{ steps.release.outputs.skipped }}
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ROVO_CD_APP_ID }}
          private-key: ${{ secrets.ROVO_CD_TOKEN }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}
          # release-pilot pushes the version bump commit and tag via git
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Release with release-pilot
        id: release
        uses: a-line-services/release-pilot@04a84a73c027b94ff0cfbf04a22a1acd63595c8c # v1
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          cargo-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-vscode:
    name: Publish VSCode Extension
    needs: release
    if: needs.release.outputs.skipped != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vscode-publish.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit

  publish-jetbrains:
    name: Publish JetBrains Plugin
    needs: release
    if: needs.release.outputs.skipped != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/jetbrains-publish.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Build every target first and upload only once all of them succeed, so a
  # release never ships with some platforms' archives missing
  build-lsp-binaries:
    name: Build rovo-lsp (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.skipped != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build rovo-lsp
        run: cargo build --release --locked -p rovo-lsp --target ${{ matrix.target }}

      # Asset names must match `[package.metadata.binstall]` in rovo-lsp/Cargo.toml
      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: rovo-lsp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: tar -czf "rovo-lsp-$TARGET.tar.gz" -C "target/$TARGET/release" "$BIN"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rovo-lsp-${{ matrix.target }}
          path: rovo-lsp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release-lsp-binaries:
    name: Release rovo-lsp binaries
    needs: [release, build-lsp-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # binstall downloads from `/releases/download/v{version}/`, see rovo-lsp/Cargo.toml
      - name: Check release tag matches binstall pkg-url
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' is not 'v$VERSION'; update pkg-url in rovo-lsp/Cargo.toml"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rovo-lsp-*
          merge-multiple: true

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" rovo-lsp-*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  no-release:
    name: No Release Needed
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No changes detected since last release. Skipping release."
